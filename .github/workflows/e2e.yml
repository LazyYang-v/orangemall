# Playwright 冒烟：构建后端 → 拉起整套 compose 栈 → 构建前端 → 跑 frontend/playwright/tests
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jars
        working-directory: backend
        run: mvn -B -q clean install -DskipTests

      - name: Generate throwaway secrets (.env is gitignored)
        working-directory: backend/deploy
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 24)"
            echo "PAY_SANDBOX_KEY=$(openssl rand -hex 24)"
            echo "INNER_SECRET=$(openssl rand -hex 24)"
          } > .env

      - name: Build frontend (nginx serves frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start stack
        working-directory: backend/deploy
        run: |
          docker compose up -d --build
          # OM-018：依赖链按 healthcheck 编排（infra → 业务服务 readiness → 网关 → Nginx），--wait 等全部 healthy；
          # 空库由各服务 Flyway 启动时建表 + 灌种子数据
          docker compose --profile app up -d --build --wait --wait-timeout 900 || { docker compose --profile app ps; docker compose --profile app logs --tail 80; exit 1; }

      - name: Wait for services
        run: |
          probe() {
            curl -sf "$@" | grep -q '"code":0'
          }
          for i in $(seq 1 100); do
            if probe -X POST -H 'Content-Type: application/json' -d '{"phone":"13800000000","password":"123456"}' http://localhost:8090/api/auth/login \
              && probe http://localhost:8090/api/products/1001 \
              && probe http://localhost:8090/api/coupons/templates \
              && probe http://localhost:8090/api/seckill/sessions; then
              echo "stack ready after $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "stack not ready"; exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Dump service logs
        if: failure()
        working-directory: backend/deploy
        run: docker compose --profile app logs --tail=200
