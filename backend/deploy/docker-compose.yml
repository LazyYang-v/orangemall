# 橙选商城一键部署
#   基础设施：docker compose up -d
#   全部服务：docker compose --profile app up -d --build   （先在 backend/ 下 mvn package）
#   访问：http://localhost:8090（Nginx：前端静态资源 + /api 反代网关 + 秒杀限流）
#         网关直连 http://localhost:18080 （宿主机 8080 已被占用）
name: orange-mall

x-svc: &svc
  profiles: ["app"]
  restart: unless-stopped
  environment: &svc-env
    TZ: Asia/Shanghai
    MYSQL_HOST: mysql
    REDIS_HOST: redis
    NACOS_ADDR: nacos:8848
    SEATA_ADDR: seata:8091
    RABBIT_HOST: rabbitmq
    KAFKA_ADDR: kafka:9092
    JWT_SECRET: orange-mall-jwt-secret-2026-change-me
    JAVA_OPTS: -Xms192m -Xmx320m -XX:MaxMetaspaceSize=160m -Xss512k
  depends_on: &svc-deps
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    nacos: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/mall.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.0-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2-slim
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "false"
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      retries: 40

  seata:
    image: seataio/seata-server:2.0.0
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
      SEATA_IP: ${SEATA_IP:-127.0.0.1}
      JVM_XMS: 192m
      JVM_XMX: 256m
    ports: ["8091:8091", "7091:7091"]

  # ---------------- 微服务 ----------------
  mall-gateway:
    <<: *svc
    build: ../mall-gateway
    ports: ["18080:8080"]

  mall-user:
    <<: *svc
    build: ../mall-user
    depends_on: { <<: *svc-deps, seata: { condition: service_started } }

  mall-product:
    <<: *svc
    build: ../mall-product
    depends_on: { <<: *svc-deps, seata: { condition: service_started } }

  mall-cart:
    <<: *svc
    build: ../mall-cart

  mall-marketing:
    <<: *svc
    build: ../mall-marketing
    depends_on: { <<: *svc-deps, seata: { condition: service_started } }

  mall-order:
    <<: *svc
    build: ../mall-order
    depends_on: { <<: *svc-deps, seata: { condition: service_started }, rabbitmq: { condition: service_healthy } }

  mall-pay:
    <<: *svc
    build: ../mall-pay
    depends_on: { <<: *svc-deps, rabbitmq: { condition: service_healthy } }

  mall-seckill:
    <<: *svc
    build: ../mall-seckill
    depends_on: { <<: *svc-deps, kafka: { condition: service_healthy } }

  nginx:
    image: nginx:1.27-alpine
    profiles: ["app"]
    restart: unless-stopped
    ports: ["8090:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on: [mall-gateway]

volumes:
  mysql-data:
