# 橙选商城 Nginx：前端静态资源 + /api、/ws 反代网关 + 秒杀入口限流（第一层削峰）
limit_req_zone $binary_remote_addr zone=seckill_ip:10m rate=200r/s;
limit_req_status 429;

upstream mall_gateway {
    server mall-gateway:8080;
    keepalive 256;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（Vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 秒杀下单：IP 级漏桶限流，突发 400；超出直接 429，不打到网关
    location ~ ^/api/seckill/[^/]+/[^/]+/orders$ {
        limit_req zone=seckill_ip burst=400 nodelay;
        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA History 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
