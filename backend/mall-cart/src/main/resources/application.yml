server:
  port: 9003

spring:
  application:
    name: mall-cart
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

# Phase 4（OM-018 / OM-020）：actuator 走独立管理端口 9103（只在容器网络内可达，网关路由不到 → 不对外暴露）。
#   /actuator/health/readiness → compose healthcheck；/actuator/prometheus → Prometheus 抓取
management:
  server:
    port: ${MANAGEMENT_PORT:9103}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
