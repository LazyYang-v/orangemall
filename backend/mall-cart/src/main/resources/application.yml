server:
  port: 9003

spring:
  application:
    name: mall-cart
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
