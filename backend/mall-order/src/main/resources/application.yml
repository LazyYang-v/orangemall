server:
  port: 9005

spring:
  application:
    name: mall-order
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: mall
    password: mall
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        default-requeue-rejected: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: mall_tx_group
  service:
    vgroup-mapping:
      mall_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

jwt:
  secret: ${JWT_SECRET:orange-mall-jwt-secret-2026-change-me}

mall:
  order:
    # 已完成/已关闭/已取消且创建超过 N 天的订单迁入 t_order_archive（每天 03:30 执行）
    archive-days: ${ORDER_ARCHIVE_DAYS:90}
    archive-cron: "0 30 3 * * *"
    # 物流模拟器（替代快递鸟轨迹订阅推送）：每隔 N 毫秒推进一步
    logistics-step-ms: 12000

logging:
  level:
    root: info
    io.seata: warn
