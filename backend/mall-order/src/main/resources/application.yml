server:
  port: 9005

spring:
  application:
    name: mall-order
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
  # Phase 4：Flyway 迁移。独立连接（不经 Seata 数据源代理）；存量库（由旧 init SQL 建成、无 history 表）
  # 在 V2（结构+种子）处接管，只执行 V3 起的增量；全新空库从 V1 开始。
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: mall
    password: mall
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        default-requeue-rejected: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: mall_tx_group
  service:
    vgroup-mapping:
      mall_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

jwt:
  secret: ${JWT_SECRET:orange-mall-jwt-secret-2026-change-me}

mall:
  order:
    # 已完成/已关闭/已取消且创建超过 N 天的订单迁入 t_order_archive（每天 03:30 执行）
    archive-days: ${ORDER_ARCHIVE_DAYS:90}
    archive-cron: "0 30 3 * * *"
    # 物流模拟器（替代快递鸟轨迹订阅推送）：每隔 N 毫秒推进一步
    logistics-step-ms: 12000

logging:
  level:
    root: info
    io.seata: warn

# Phase 4（OM-018 / OM-020）：actuator 走独立管理端口 9105（只在容器网络内可达，网关路由不到 → 不对外暴露）。
#   /actuator/health/readiness → compose healthcheck；/actuator/prometheus → Prometheus 抓取
management:
  server:
    port: ${MANAGEMENT_PORT:9105}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
