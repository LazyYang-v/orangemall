server:
  port: 9006

spring:
  application:
    name: mall-pay
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
  # Phase 4：Flyway 迁移。独立连接（不经 Seata 数据源代理）；存量库（由旧 init SQL 建成、无 history 表）
  # 在 V2（结构+种子）处接管，只执行 V3 起的增量；全新空库从 V1 开始。
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: mall
    password: mall

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

mall:
  pay:
    # 沙箱验签密钥（真实环境：支付宝 RSA2 / 微信 V3 平台证书）
    sandbox-key: ${PAY_SANDBOX_KEY:orange-mall-sandbox-key-2026}

logging:
  level:
    root: info

# Phase 4（OM-018 / OM-020）：actuator 走独立管理端口 9106（只在容器网络内可达，网关路由不到 → 不对外暴露）。
#   /actuator/health/readiness → compose healthcheck；/actuator/prometheus → Prometheus 抓取
management:
  server:
    port: ${MANAGEMENT_PORT:9106}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
