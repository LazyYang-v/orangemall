server:
  port: 9007
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 2000
    max-connections: 10000
    keep-alive-timeout: 30s

spring:
  application:
    name: mall-seckill
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9094}
    producer:
      acks: all
      retries: 3
      batch-size: 65536
      properties:
        linger.ms: 5
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: mall-seckill
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info

seckill:
  # 令牌桶（每用户）：容量 5，2 个/秒
  bucket-capacity: 5
  bucket-rate: 2
  # 低于该信用分直接拦截（7009）
  min-credit: 300
  path-ttl-seconds: 60
  result-ttl-seconds: 86400
  # 后台缓存命中率读取的 Redis Hash（商品详情 Cache Aside 统计：field hit / miss）
  cache-stats-key: cache:stats
