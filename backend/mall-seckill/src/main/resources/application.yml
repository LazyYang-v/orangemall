server:
  port: 9007
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 2000
    max-connections: 10000
    keep-alive-timeout: 30s

spring:
  application:
    name: mall-seckill
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  # Phase 4：Flyway 迁移。独立连接（不经 Seata 数据源代理）；存量库（由旧 init SQL 建成、无 history 表）
  # 在 V2（结构+种子）处接管，只执行 V3 起的增量；全新空库从 V1 开始。
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9094}
    producer:
      acks: all
      retries: 3
      batch-size: 65536
      properties:
        linger.ms: 5
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: mall-seckill
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input


seckill:
  # 令牌桶（每用户）：容量 5，2 个/秒
  bucket-capacity: 5
  bucket-rate: 2
  # 低于该信用分直接拦截（7009）
  min-credit: 300
  path-ttl-seconds: 60
  result-ttl-seconds: 86400
  # 后台缓存命中率读取的 Redis Hash（商品详情 Cache Aside 统计：field hit / miss）
  cache-stats-key: cache:stats
  # OM-013 在途滞留：持续不变超过该秒数告警；无积压时自动重置（泄漏）
  inflight-stuck-seconds: ${SECKILL_INFLIGHT_STUCK_SECONDS:180}
  inflight-auto-reset: ${SECKILL_INFLIGHT_AUTO_RESET:true}
  # OM-025 落单吞吐：主题分区数（只增不减）与消费线程数；消息按 userId 分区
  topic-partitions: ${SECKILL_TOPIC_PARTITIONS:12}
  consumer-concurrency: ${SECKILL_CONSUMER_CONCURRENCY:12}

# Phase 4（OM-018 / OM-020）：actuator 走独立管理端口 9107（只在容器网络内可达，网关路由不到 → 不对外暴露）。
#   /actuator/health/readiness → compose healthcheck；/actuator/prometheus → Prometheus 抓取
management:
  server:
    port: ${MANAGEMENT_PORT:9107}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
