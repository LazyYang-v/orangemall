server:
  port: 9001

spring:
  application:
    name: mall-user
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
  # Phase 4：Flyway 迁移。独立连接（不经 Seata 数据源代理）；存量库（由旧 init SQL 建成、无 history 表）
  # 在 V2（结构+种子）处接管，只执行 V3 起的增量；全新空库从 V1 开始。
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: mall_tx_group
  service:
    vgroup-mapping:
      mall_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT
  # TC RPC 超时（Phase 5 HA）：默认 RM 15s / TM 30s。TC 宕机瞬间已发出的请求收不到响应，要等满超时；
  # 扣库存分支此时还持有 SKU 行锁，同 SKU 的下单全部排在它后面。正常 TC 往返为毫秒级，压测最慢整单 ≈ 3s，取 5s。
  transport:
    rpc-rm-request-timeout: ${SEATA_RPC_TIMEOUT:5000}
    rpc-tm-request-timeout: ${SEATA_RPC_TIMEOUT:5000}
  client:
    # TC 选择（Phase 5 HA）：Seata 2.0 默认 XID 负载均衡把一个全局事务的所有请求都发回发起它的 TC；
    # 那台 TC 宕机后、客户端下一轮重连摘除它之前，在途事务的回滚上报全部失败，其全局锁要等超时才释放。
    # db 存储模式下任一 TC 都能处理任意 XID，改随机选择，回滚重试（默认 5 次）能落到存活的 TC 上立即释放锁。
    load-balance:
      type: ${SEATA_LOAD_BALANCE:RandomLoadBalance}


jwt:
  secret: ${JWT_SECRET:orange-mall-jwt-secret-2026-change-me}
  ttl-seconds: 604800

# Phase 4（OM-018 / OM-020）：actuator 走独立管理端口 9101（只在容器网络内可达，网关路由不到 → 不对外暴露）。
#   /actuator/health/readiness → compose healthcheck；/actuator/prometheus → Prometheus 抓取
management:
  server:
    port: ${MANAGEMENT_PORT:9101}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
